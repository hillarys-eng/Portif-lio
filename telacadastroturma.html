<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Turmas</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
  <link rel="stylesheet" href="telacadastroturma.css" />
</head>
<body>
  <header class="cabecalho">
    <nav class="menu">
      <ul class="menu-lista">
        <li><a href="./index.html"> Início</a></li>
        <li><a href="./telacadastroaluno.html"> Cadastrar Aluno</a></li>
        <li><a href="./telalistagemturma.html"> Listar turma</a></li>
        <li><a href="./telacadastroturma.html"> Cadastrar Turma</a></li>
        <li><a href="./telacadastroprojeto.html"> Cadastrar Projeto</a></li>
        <li><a href="./Portifólio.html">Portfólio</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-wrapper">
    <div class="form-container">
      <h1 class="page-title">Cadastro de Turma</h1>

      <section class="form-card">
        <form id="formTurma">
          <div class="form-group">
            <label for="id">Id *</label>
            <input id="id" name="Id" type="number" placeholder="Ex: 101" required />
          </div>

          <div class="form-group">
            <label for="alunoId">AlunoId *</label>
            <input id="alunoId" name="AlunoId" type="number" placeholder="Ex: 25" required />
          </div>

          <div class="form-group">
            <label for="professor">Professor *</label>
            <input id="professor" name="Professor" type="text" placeholder="Ex: Prof. Marina Silva" required />
          </div>

          <div class="form-group">
            <label for="alunos">Alunos *</label>
            <input id="alunos" name="Alunos" type="text" placeholder="Ex: Lucas Rocha, Ana Clara, Gabriel Costa" required />
          </div>

          <div class="form-group">
            <label for="projetos">Projetos *</label>
            <input id="projetos" name="Projetos" type="text" placeholder="Ex: Sistema de Biblioteca, App de Finanças Pessoais" required />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar Turma</button>
            <button type="reset" class="btn btn-secondary">Limpar</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
